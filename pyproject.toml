[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-swim-analytics"
version = "0.1.0"
description = "Local-first analysis of pool swimming workouts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
fit = ["garmin-fit-sdk>=21.221.0,<22"]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3"]

[project.scripts]
swim-analytics = "swim_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["garmin_fit_sdk"]
ignore_missing_imports = true
