name: Python CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[fit,dev]'
      - run: ruff check .
      - run: mypy
      - run: python -m unittest discover -s tests -v
      - run: swim-analytics --help
