name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '24 8 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public_files.py
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --no-banner /repo
      - run: python -m pip install '.[fit,dev]'
      - run: pip-audit
